<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#04060f" />
<title>番茄专注星球 · 地球日夜同步</title>
<style>
  :root{
    --ink:#eaf0ff;
    --muted:rgba(234,240,255,.56);
    --faint:rgba(234,240,255,.34);
    --line:rgba(255,255,255,.10);
    --card:rgba(12,19,36,.70);
    --focus1:#ffa25c; --focus2:#ff5f52; --focus3:#ff2e63;
    --break1:#8bf3c8; --break2:#34c98b; --break3:#14a3a0;
    --accent1:var(--focus1); --accent2:var(--focus2); --accent3:var(--focus3);
    --glow:rgba(255,95,82,.35);
    --radius:26px;
  }
  body.mode-break{
    --accent1:var(--break1); --accent2:var(--break2); --accent3:var(--break3);
    --glow:rgba(52,201,139,.30);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 800px at 50% 38%, #0d1730 0%, #070c1a 45%, #03050c 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #globe{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    touch-action:none; cursor:grab;
  }
  #globe.dragging{ cursor:grabbing; }

  /* ---------- 顶栏 ---------- */
  .hud{
    position:fixed; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:16px 20px;
    pointer-events:none;
  }
  .hud > *{ pointer-events:auto; }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-size:14px; font-weight:600; letter-spacing:.04em;
    color:rgba(234,240,255,.86);
    padding:9px 14px; border-radius:999px;
    background:rgba(10,16,30,.5); border:1px solid var(--line);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    white-space:nowrap;
  }
  .brand .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent2); box-shadow:0 0 12px var(--accent2);
  }
  .clock-wrap{ text-align:center; line-height:1.15; }
  .clock{
    font-size:clamp(20px,2.4vw,26px); font-weight:600;
    font-variant-numeric:tabular-nums; letter-spacing:.06em;
    text-shadow:0 2px 18px rgba(0,0,0,.6);
  }
  .clock-sub{
    margin-top:3px; font-size:11px; color:var(--muted); letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
  }
  .icon-btn{
    appearance:none; border:1px solid var(--line); cursor:pointer;
    background:rgba(10,16,30,.5); color:var(--ink);
    border-radius:999px; padding:10px 16px; font-size:13px; font-weight:600;
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    transition:transform .15s ease, background .2s ease, border-color .2s;
    font-family:inherit;
  }
  .icon-btn:hover{ background:rgba(28,40,68,.72); border-color:rgba(255,255,255,.2); }
  .icon-btn:active{ transform:scale(.96); }

  /* ---------- 主卡片 ---------- */
  .stage{
    position:fixed; inset:0; z-index:5;
    display:grid; place-items:center;
    padding:76px 16px 24px;
    pointer-events:none;
  }
  .card{
    pointer-events:auto;
    position:relative;
    width:min(430px,94vw);
    padding:20px 22px 18px;
    border-radius:var(--radius);
    background:
      linear-gradient(180deg, rgba(22,32,58,.72) 0%, rgba(10,16,30,.80) 100%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 30px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(22px) saturate(1.25);
    -webkit-backdrop-filter:blur(22px) saturate(1.25);
    transition:box-shadow .6s ease, border-color .6s ease;
  }
  body.running .card{
    border-color:color-mix(in srgb, var(--accent2) 34%, transparent);
    box-shadow:0 30px 90px rgba(0,0,0,.62), 0 0 0 1px var(--glow), 0 0 70px -18px var(--glow), inset 0 1px 0 rgba(255,255,255,.08);
  }

  .tabs{
    display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
    padding:5px; border-radius:16px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.06);
  }
  .tab{
    appearance:none; border:0; cursor:pointer; font-family:inherit;
    padding:9px 4px; border-radius:12px; font-size:13px; font-weight:600;
    color:var(--muted); background:transparent;
    transition:color .2s, background .2s, box-shadow .25s;
  }
  .tab:hover{ color:var(--ink); }
  .tab.active{
    color:#10141f;
    background:linear-gradient(135deg,var(--accent1),var(--accent3));
    box-shadow:0 8px 22px -8px var(--glow);
  }

  .ring-wrap{
    position:relative; margin:14px auto 6px;
    width:min(300px,72vw); aspect-ratio:1/1;
    display:grid; place-items:center;
  }
  .ring{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .ring .track{ fill:none; stroke:rgba(255,255,255,.075); stroke-width:13; }
  .ring .progress{
    fill:none; stroke:url(#gradAccent); stroke-width:13; stroke-linecap:round;
    transition:stroke-dashoffset .3s linear;
    filter:drop-shadow(0 0 14px var(--glow));
  }
  .ring .runner{ transition:transform .3s linear; }
  .center{
    position:relative; z-index:2; display:flex; flex-direction:column;
    align-items:center; gap:2px; text-align:center; pointer-events:none;
  }
  .mascot{
    width:clamp(46px,13vw,58px); height:auto; display:block;
    filter:drop-shadow(0 8px 16px rgba(0,0,0,.45));
    animation:bob 3.4s ease-in-out infinite;
  }
  body.running .mascot{ animation-duration:1.5s; }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-2deg); }
    50%{ transform:translateY(-5px) rotate(2deg); }
  }
  .digits{
    font-size:clamp(42px,11.5vw,58px); font-weight:650; line-height:1.05;
    letter-spacing:.01em; font-variant-numeric:tabular-nums;
    text-shadow:0 6px 30px rgba(0,0,0,.5);
    transition:color .3s ease;
  }
  .digits.warn{ color:#ffd0c6; animation:pulseWarn 1s ease-in-out infinite; }
  @keyframes pulseWarn{ 50%{ opacity:.55; } }
  .phase{
    font-size:12px; letter-spacing:.22em; color:var(--accent1);
    text-transform:uppercase; font-weight:700; margin-top:2px;
  }
  .status{
    font-size:12.5px; color:var(--muted); min-height:17px; margin-top:5px;
    max-width:190px; line-height:1.4;
  }

  .controls{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; margin-top:8px;
  }
  .btn{
    appearance:none; cursor:pointer; font-family:inherit; font-size:14px; font-weight:650;
    padding:13px 8px; border-radius:15px; border:1px solid rgba(255,255,255,.11);
    background:rgba(255,255,255,.06); color:var(--ink);
    transition:transform .14s ease, background .2s ease, opacity .2s, box-shadow .25s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn:hover:not(:disabled){ background:rgba(255,255,255,.11); }
  .btn:active:not(:disabled){ transform:scale(.97); }
  .btn:disabled{ opacity:.34; cursor:default; }
  .btn.primary{
    border-color:transparent; color:#14161f;
    background:linear-gradient(135deg,var(--accent1),var(--accent3));
    box-shadow:0 12px 30px -12px var(--glow);
  }
  .btn.primary:hover:not(:disabled){ filter:brightness(1.06); }

  .stats{
    margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.075);
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;
  }
  .stat b{
    display:block; font-size:19px; font-weight:700; font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }
  .stat span{ font-size:11px; color:var(--faint); letter-spacing:.06em; }
  .harvest{
    margin-top:12px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;
    min-height:20px; font-size:12px; color:var(--faint);
  }
  .harvest .tom{
    width:15px; height:15px; border-radius:50%;
    background:linear-gradient(160deg,#ff7a5c,#e8352f);
    box-shadow:0 0 0 1px rgba(0,0,0,.25) inset, 0 3px 8px rgba(232,53,47,.35);
    animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  .harvest .tom.goal{ background:rgba(255,255,255,.10); box-shadow:none; }
  @keyframes pop{ from{ transform:scale(0); } to{ transform:scale(1); } }

  .foot{
    margin-top:11px; display:flex; justify-content:space-between; align-items:center;
    font-size:10.5px; color:rgba(234,240,255,.28); letter-spacing:.04em;
  }
  .foot kbd{
    font-family:inherit; font-size:10px; padding:1px 5px; border-radius:5px;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
  }

  /* ---------- 设置面板 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:8; background:rgba(2,4,10,.55);
    opacity:0; pointer-events:none; transition:opacity .3s ease;
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .panel{
    position:fixed; z-index:9; top:0; right:0; height:100%;
    width:min(360px,92vw); padding:20px 20px 28px;
    background:linear-gradient(180deg, rgba(18,26,48,.96), rgba(8,13,26,.98));
    border-left:1px solid rgba(255,255,255,.09);
    box-shadow:-30px 0 80px rgba(0,0,0,.5);
    transform:translateX(102%); transition:transform .38s cubic-bezier(.3,.9,.25,1);
    overflow-y:auto; overscroll-behavior:contain;
  }
  .panel.open{ transform:none; }
  .panel h2{
    margin:2px 0 16px; font-size:15px; letter-spacing:.06em; font-weight:650;
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel h2 button{
    appearance:none; border:0; background:rgba(255,255,255,.08); color:var(--ink);
    width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; line-height:1;
  }
  .panel h2 button:hover{ background:rgba(255,255,255,.16); }
  .group{ margin-bottom:18px; }
  .group-title{
    font-size:11px; letter-spacing:.16em; color:var(--faint);
    margin:0 0 9px; font-weight:700;
  }
  .field{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 0; border-bottom:1px dashed rgba(255,255,255,.06);
    font-size:13.5px;
  }
  .field:last-child{ border-bottom:0; }
  .field .hint{ display:block; font-size:11px; color:var(--faint); margin-top:2px; font-weight:400; }
  .stepper{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .stepper button{
    width:28px; height:28px; border-radius:9px; cursor:pointer;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
    color:var(--ink); font-size:15px; line-height:1; font-family:inherit;
  }
  .stepper button:hover{ background:rgba(255,255,255,.14); }
  .stepper input{
    width:46px; text-align:center; font-family:inherit; font-size:14px; font-weight:650;
    color:var(--ink); background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.12);
    border-radius:9px; padding:5px 0; font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .stepper .unit{ font-size:11px; color:var(--faint); }
  .switch{
    position:relative; width:46px; height:26px; flex:0 0 auto;
    border-radius:999px; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.12); cursor:pointer;
    transition:background .25s ease;
  }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
    border-radius:50%; background:#fff; transition:transform .25s cubic-bezier(.3,1.4,.5,1);
    box-shadow:0 2px 6px rgba(0,0,0,.35);
  }
  .switch.on{ background:linear-gradient(135deg,var(--accent1),var(--accent3)); }
  .switch.on::after{ transform:translateX(20px); }
  .range{ width:100%; accent-color:#ff5f52; }
  .panel .wide{
    width:100%; margin-top:4px; padding:11px; border-radius:13px; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600;
    background:rgba(255,255,255,.07); color:var(--ink);
    border:1px solid rgba(255,255,255,.12);
  }
  .panel .wide:hover{ background:rgba(255,255,255,.13); }
  .panel .danger{ color:#ffb4ac; }
  .panel-note{ font-size:11px; color:var(--faint); line-height:1.6; margin-top:6px; }

  /* ---------- 提示 ---------- */
  .toast{
    position:fixed; z-index:20; left:50%; bottom:34px;
    transform:translate(-50%,20px); opacity:0; pointer-events:none;
    padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600;
    background:rgba(20,30,52,.94); border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 44px rgba(0,0,0,.5);
    transition:opacity .3s ease, transform .3s ease;
    max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- 撒花 ---------- */
  .confetti{
    position:fixed; z-index:15; top:-16px; width:9px; height:14px; border-radius:2px;
    pointer-events:none; will-change:transform,opacity;
    animation:fall linear forwards;
  }
  @keyframes fall{
    0%{ transform:translate3d(0,0,0) rotate(0deg); opacity:1; }
    100%{ transform:translate3d(var(--dx),105vh,0) rotate(var(--rot)); opacity:.15; }
  }

  @media (min-width:900px){
    .stage{ justify-items:end; padding-right:max(4.5vw,34px); }
    .card{ width:min(420px,42vw); }
  }
  @media (max-width:899px){
    .stage{
      align-items:end;
      padding:64px 14px max(14px, env(safe-area-inset-bottom));
    }
    .card{ width:min(430px,94vw); padding:13px 16px 12px; border-radius:20px; }
    .tabs{ padding:4px; border-radius:14px; }
    .tab{ padding:7px 4px; font-size:12px; border-radius:10px; }
    .ring-wrap{ width:min(186px,48vw); margin:8px auto 2px; }
    .mascot{ width:36px; }
    .digits{ font-size:clamp(30px,9vw,38px); }
    .phase{ font-size:10.5px; letter-spacing:.18em; }
    .status{ font-size:11.5px; margin-top:2px; min-height:15px; }
    .controls{ gap:7px; margin-top:6px; }
    .btn{ padding:11px 6px; font-size:13px; border-radius:13px; }
    .stats{ margin-top:9px; padding-top:8px; }
    .stat b{ font-size:16px; }
    .stat span{ font-size:10px; }
    .harvest{ margin-top:7px; min-height:16px; font-size:11px; }
    .harvest .tom{ width:12px; height:12px; }
    .foot{ display:none; }
  }
  @media (max-width:899px) and (max-height:760px){
    .card{ padding:9px 14px 9px; border-radius:18px; }
    .tabs{ padding:3px; }
    .tab{ padding:6px 3px; font-size:11.5px; }
    .ring-wrap{ width:min(132px,36vw); margin:5px auto 0; }
    .mascot{ width:26px; }
    .digits{ font-size:clamp(24px,7vw,30px); }
    .phase{ font-size:9.5px; margin-top:0; }
    .status{ display:none; }
    .controls{ margin-top:4px; gap:6px; }
    .btn{ padding:8px 5px; font-size:12px; border-radius:11px; }
    .stats{ margin-top:5px; padding-top:5px; }
    .stat b{ font-size:14px; }
    .stat span{ font-size:9.5px; }
    .harvest{ display:none; }
  }
  @media (max-width:520px){
    .hud{ padding:12px 12px; }
    .brand span{ display:none; }
    .brand{ padding:9px 11px; }
    .stage{ padding:64px 12px 18px; }
    .card{ padding:16px 16px 14px; border-radius:22px; }
    .clock-sub{ font-size:10px; }
    .foot{ display:none; }
  }
  @media (max-height:720px){
    .ring-wrap{ width:min(248px,64vw); }
    .mascot{ width:42px; }
    .stats{ margin-top:12px; padding-top:10px; }
  }
</style>
</head>

<body>
<canvas id="globe" aria-hidden="true"></canvas>

<!-- 顶栏 -->
<header class="hud">
  <div class="brand"><i class="dot"></i><span>番茄专注星球</span></div>
  <div class="clock-wrap">
    <div class="clock" id="clock">--:--:--</div>
    <div class="clock-sub" id="clockSub">北京时间 · 东八区</div>
  </div>
  <button class="icon-btn" id="settingsBtn" type="button" title="设置 (S)">设置</button>
</header>

<!-- 番茄钟卡片 -->
<main class="stage">
  <section class="card" id="card">
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" type="button" role="tab" data-mode="focus">专注</button>
      <button class="tab" type="button" role="tab" data-mode="short">小休息</button>
      <button class="tab" type="button" role="tab" data-mode="long">大休息</button>
    </nav>

    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent1)" />
            <stop offset="55%" stop-color="var(--accent2)" />
            <stop offset="100%" stop-color="var(--accent3)" />
          </linearGradient>
        </defs>
        <circle class="track" cx="100" cy="100" r="88" />
        <g id="runnerGroup">
          <circle class="progress" id="progress" cx="100" cy="100" r="88" transform="rotate(-90 100 100)" />
          <circle id="knob" cx="100" cy="12" r="6" fill="#fff" opacity=".92" />
        </g>
      </svg>
      <div class="center">
        <svg class="mascot" id="mascot" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <radialGradient id="tomBody" cx="35%" cy="28%" r="78%">
              <stop offset="0%" stop-color="#ff9c78" />
              <stop offset="55%" stop-color="#f2543f" />
              <stop offset="100%" stop-color="#c81f34" />
            </radialGradient>
          </defs>
          <path d="M32 10c4.6 0 8.6 2 10.6 5.4-3 .6-5.2 2.4-6.2 4.6-1.4-2.2-3.6-3.6-6.4-3.8C28.8 12.6 30.2 10 32 10z" fill="#3fbf72"/>
          <ellipse cx="32" cy="37" rx="22" ry="20" fill="url(#tomBody)"/>
          <ellipse cx="25" cy="31" rx="3.1" ry="3.6" fill="#20161a"/>
          <ellipse cx="39" cy="31" rx="3.1" ry="3.6" fill="#20161a"/>
          <ellipse cx="26.1" cy="29.7" rx="1.1" ry="1.3" fill="#fff" opacity=".9"/>
          <ellipse cx="40.1" cy="29.7" rx="1.1" ry="1.3" fill="#fff" opacity=".9"/>
          <path id="mouth" d="M27 40c1.6 2.2 3.4 3.2 5 3.2s3.4-1 5-3.2" stroke="#20161a" stroke-width="2.1" fill="none" stroke-linecap="round"/>
          <circle cx="17.5" cy="38" r="3.4" fill="#ff8a75" opacity=".55"/>
          <circle cx="46.5" cy="38" r="3.4" fill="#ff8a75" opacity=".55"/>
          <ellipse cx="24" cy="24" rx="4.2" ry="2.4" fill="#fff" opacity=".28"/>
        </svg>
        <div class="digits" id="digits">30:00</div>
        <div class="phase" id="phaseLabel">FOCUS</div>
        <div class="status" id="status">准备好了就按下开始吧</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn" type="button">开始</button>
      <button class="btn" id="resetBtn" type="button">重置</button>
      <button class="btn" id="skipBtn" type="button">跳过</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="statDone">0</b><span>今日番茄</span></div>
      <div class="stat"><b id="statMin">0</b><span>专注分钟</span></div>
      <div class="stat"><b id="statStreak">0</b><span>连续天数</span></div>
    </div>
    <div class="harvest" id="harvest"></div>

    <div class="foot">
      <span>空格 开始/暂停 · R 重置</span>
      <span>双击页面可全屏</span>
    </div>
  </section>
</main>

<!-- 设置 -->
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-label="设置">
  <h2>设置 <button id="closeBtn" type="button" title="关闭">✕</button></h2>

  <div class="group">
    <p class="group-title">时长</p>
    <div class="field">
      <span>专注时长<span class="hint">每完成一个番茄</span></span>
      <div class="stepper" data-step="1">
        <button type="button" data-act="dec">−</button>
        <input id="inFocus" type="number" min="1" max="180" value="30" />
        <button type="button" data-act="inc">+</button>
        <span class="unit">分</span>
      </div>
    </div>

    + 4 * ecc * y * Math.sin(M * RAD) * Math.cos(2 * L0 * RAD)
    - 0.5 * y * y * Math.sin(4 * L0 * RAD)
    - 1.25 * ecc * ecc * Math.sin(2 * M * RAD)
  );
  const utcHours = (ts % 86400000) / 3600000;
  let lon = -((utcHours - 12) * 15 + eqTime / 4);
  lon = (((lon + 180) % 360) + 360) % 360 - 180;
  return { lat: decl, lon: lon };
}

/* ========== 陆地轮廓解析 ========== */
const RINGS = (() => {
  const out = [];
  for (const seg of LAND.split(";")) {
    if (!seg) continue;
    const ring = [];
    for (const pt of seg.split("|")) {
      const c = pt.indexOf(",");
      if (c < 0) continue;
      ring.push([parseFloat(pt.slice(0, c)), parseFloat(pt.slice(c + 1))]);
    }
    if (ring.length > 2) out.push(ring);
  }
  return out;
})();

/* ========== 画布与视角状态 ========== */
const canvas = $("globe");
const ctx = canvas.getContext("2d", { alpha: true });

const G = {

  rot: 0, spin: 1, tilt: 0.40,
  dragging: false, lastX: 0, dragVel: 0,

};

function buildStars() {
  const n = Math.round(clamp((G.w * G.h) / 8000, 100, 340));
  G.stars = [];
  for (let i = 0; i < n; i++) {
    G.stars.push({
      x: Math.random() * G.w,
      y: Math.random() * G.h,
      r: Math.random() * 1.2 + 0.25,
      a: Math.random() * 0.55 + 0.12,
      tw: Math.random() * Math.PI * 2,
      sp: Math.random() * 0.8 + 0.2
    });
  }
}

function resize() {
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.w = window.innerWidth;
  G.h = window.innerHeight;
  canvas.width = Math.round(G.w * G.dpr);
  canvas.height = Math.round(G.h * G.dpr);
  canvas.style.width = G.w + "px";
  canvas.style.height = G.h + "px";
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  // 地球是背景元素，宽屏让位给卡片，窄屏居中偏上、卡片浮在其下方
  const hudH = 74;
  if (G.w >= 900) {
    const card = document.querySelector(".card");
    const left = card ? card.getBoundingClientRect().left : G.w * 0.62;
    const availW = Math.max(260, left - 16);
    const availH = Math.max(260, G.h - hudH);
    G.cx = availW * 0.5 + 8;
    G.cy = hudH + availH * 0.5;
    G.R = Math.max(140, Math.min(availW * 0.46, availH * 0.47, 440));
  } else {
    const card = document.querySelector(".card");
    const cardTop = card ? card.getBoundingClientRect().top : G.h * 0.55;
    const availH = Math.max(120, cardTop - hudH);
    G.cx = G.w * 0.5;
    G.cy = hudH + availH * 0.5;
    G.R = Math.max(88, Math.min(G.w * 0.48, availH * 0.62, 260));
  }
  buildStars();
}

/* 正交投影：经纬度 -> 屏幕 */
function project(lat, lon) {
  const la = lat * RAD;
  const lo = lon * RAD + G.rot;
  const cl = Math.cos(la);
  const x = cl * Math.sin(lo);
  const y = Math.sin(la);
  const z = cl * Math.cos(lo);
  const ct = Math.cos(G.tilt), st = Math.sin(G.tilt);
  return { x: G.cx + x * G.R, y: G.cy - (y * ct - z * st) * G.R, z: y * st + z * ct };
}

/* 太阳方向同时给出世界坐标(wx,wy,wz)与相机坐标(x,y,z) */
function sunVector(ts) {
  const s = subsolarPoint(ts);
  const la = s.lat * RAD, lo = s.lon * RAD;
  const cl = Math.cos(la);
  // 世界坐标：固定在地理经度上，供城市灯光等使用
  const wx = cl * Math.sin(lo), wy = Math.sin(la), wz = cl * Math.cos(lo);
  // 相机坐标：地球自转 G.rot 也作用在经度上，光照必须与之同步
  const loCam = lo + G.rot;
  const cx = cl * Math.sin(loCam), cz = cl * Math.cos(loCam);
  const ct = Math.cos(G.tilt), st = Math.sin(G.tilt);
  return {
    lat: s.lat, lon: s.lon, wx: wx, wy: wy, wz: wz,
    x: cx, y: wy * ct - cz * st, z: wy * st + cz * ct
  };
}

/* 光照强度：世界坐标点与太阳方向点积 */
function sunDotWorld(wx, wy, wz, sun) {
  return wx * sun.wx + wy * sun.wy + wz * sun.wz;
}



/* ========== 陆地掩膜（等距圆柱投影，只生成一次） ========== */
const MASK_W = 1440, MASK_H = 720;
const maskCanvas = document.createElement("canvas");
maskCanvas.width = MASK_W;
maskCanvas.height = MASK_H;
let maskData = null;

function buildLandMask() {
  const m = maskCanvas.getContext("2d");
  m.clearRect(0, 0, MASK_W, MASK_H);
  m.fillStyle = "#fff";
  m.beginPath();
  const X = (lon) => (lon + 180) / 360 * MASK_W;
  const Y = (lat) => (90 - lat) / 180 * MASK_H;
  for (let n = 0; n < RINGS.length; n++) {
    const ring = RINGS[n];
    m.moveTo(X(ring[0][0]), Y(ring[0][1]));
    for (let i = 1; i < ring.length; i++) m.lineTo(X(ring[i][0]), Y(ring[i][1]));
    m.closePath();
  }
  m.fill("nonzero");
  maskData = m.getImageData(0, 0, MASK_W, MASK_H).data;
}

/* ========== 球面逐像素渲染（含昼夜） ========== */
const SPHERE_N = 288;
const sphereCanvas = document.createElement("canvas");
sphereCanvas.width = SPHERE_N;
sphereCanvas.height = SPHERE_N;
const sphereCtx = sphereCanvas.getContext("2d");
const sphereImg = sphereCtx.createImageData(SPHERE_N, SPHERE_N);

const OCEAN_LIT = [58, 142, 204];
const OCEAN_DARK = [5, 17, 44];
const LAND_LIT = [126, 190, 134];
const LAND_DARK = [10, 27, 22];

/* 每像素的纬度、基准经度、相机坐标只与投影有关，预计算一次即可 */
const PIX = (() => {
  const n = SPHERE_N * SPHERE_N;
  const rowOff = new Int32Array(n);      // 掩膜数据中的行偏移（已含 RGBA 步长）
  const baseLon = new Float32Array(n);   // 未加自转的经度（度）
  const px = new Float32Array(n);
  const py = new Float32Array(n);
  const pz = new Float32Array(n);
  const valid = new Uint8Array(n);
  const half = SPHERE_N / 2;
  const ct = Math.cos(G.tilt), st = Math.sin(G.tilt);
  const lonScale = MASK_W / 360;
  let k = 0;
  for (let j = 0; j < SPHERE_N; j++) {
    const cy = -((j + 0.5) / half - 1);
    for (let i = 0; i < SPHERE_N; i++, k++) {
      const cx = (i + 0.5) / half - 1;
      const r2 = cx * cx + cy * cy;
      if (r2 >= 1) { valid[k] = 0; continue; }
      const cz = Math.sqrt(1 - r2);
      const wy = cy * ct + cz * st;
      const wz = -cy * st + cz * ct;
      const lat = Math.asin(wy > 1 ? 1 : wy < -1 ? -1 : wy) * DEG;
      let row = ((90 - lat) / 180 * MASK_H) | 0;
      if (row < 0) row = 0; else if (row >= MASK_H) row = MASK_H - 1;
      rowOff[k] = row * MASK_W * 4;
      // 基准列号 = 经度换算 + 半周偏移；存成列号可省掉每帧的除法与取整
      baseLon[k] = Math.atan2(cx, wz) * lonScale + MASK_W / 2;
      px[k] = cx; py[k] = cy; pz[k] = cz;
      valid[k] = 1;
    }
  }
  return { rowOff: rowOff, baseLon: baseLon, px: px, py: py, pz: pz, valid: valid,
           colSpan: MASK_W, colScale: lonScale };
})();

function renderSphere(sun) {
  const d = sphereImg.data;
  const { rowOff, baseLon, px, py, pz, valid } = PIX;
  const colSpan = PIX.colSpan;
  const rotCols = G.rot * DEG * PIX.colScale;   // 自转折算成的列偏移
  const sx = sun.x, sy = sun.y, sz = sun.z;
  const n = SPHERE_N * SPHERE_N;
  for (let k = 0, o = 0; k < n; k++, o += 4) {
    if (!valid[k]) { d[o + 3] = 0; continue; }
    let col = (baseLon[k] - rotCols) | 0;
    col %= colSpan;
    if (col < 0) col += colSpan;
    const isLand = maskData[rowOff[k] + col * 4] > 127;

    const cx = px[k], cy = py[k], cz = pz[k];
    const dot = cx * sx + cy * sy + cz * sz;
    const day = smooth(-0.26, 0.26, dot);
    const e = dot * 3.6;
    const dusk = e > 4 ? 0 : Math.exp(-e * e);

    const lit = isLand ? LAND_LIT : OCEAN_LIT;
    const dark = isLand ? LAND_DARK : OCEAN_DARK;
    const limb = 0.62 + 0.38 * cz;
    d[o] = (dark[0] + (lit[0] - dark[0]) * day + 96 * dusk) * limb;
    d[o + 1] = (dark[1] + (lit[1] - dark[1]) * day + 46 * dusk) * limb;
    d[o + 2] = (dark[2] + (lit[2] - dark[2]) * day + 16 * dusk) * limb;
    d[o + 3] = 255;
  }
  sphereCtx.putImageData(sphereImg, 0, 0);
}

/* 球体贴图最多每 33ms 重算一次，中间帧复用上一张 */
let sphereStamp = 0;
function drawSphere(sun, ts) {
  if (!sphereStamp || ts - sphereStamp > 33) {
    renderSphere(sun);
    sphereStamp = ts;
  }
  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R, 0, 6.2832);
  ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(sphereCanvas, G.cx - G.R, G.cy - G.R, G.R * 2, G.R * 2);
  ctx.restore();
}

/* ========== 经纬网格 ========== */
function drawGraticule() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R, 0, 6.2832);
  ctx.clip();
  ctx.strokeStyle = "rgba(180,215,255,.09)";
  ctx.lineWidth = 1;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    let started = false;
    for (let lon = -180; lon <= 180; lon += 4) {
      const q = project(lat, lon);
      if (q.z > 0) {
        if (!started) { ctx.moveTo(q.x, q.y); started = true; } else ctx.lineTo(q.x, q.y);
      } else started = false;
    }
    ctx.stroke();
  }
  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath();
    let started = false;
    for (let lat = -88; lat <= 88; lat += 4) {
      const q = project(lat, lon);
      if (q.z > 0) {
        if (!started) { ctx.moveTo(q.x, q.y); started = true; } else ctx.lineTo(q.x, q.y);
      } else started = false;
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ========== 城市灯光 ========== */
function drawCities(ts, sun) {
  const t = ts * 0.001;
  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R, 0, 6.2832);
  ctx.clip();
  ctx.globalCompositeOperation = "lighter";

  for (let i = 0; i < CITIES.length; i++) {
    const c = CITIES[i];
    const q = project(c[1], c[0]);
    if (q.z < 0.02) continue;
    const la = c[1] * RAD, lo = c[0] * RAD;
    const cl = Math.cos(la);
    const dot = sunDotWorld(cl * Math.sin(lo), Math.sin(la), cl * Math.cos(lo), sun);
    const night = 1 - smooth(-0.05, 0.10, dot);
    if (night < 0.05) continue;
    const edge = smooth(0.02, 0.28, q.z);
    const flick = 0.82 + 0.18 * Math.sin(t * 1.7 + i * 2.1);
    const a = night * edge * c[2] * flick;
    const r = Math.max(1.1, G.R * 0.011);
    const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 5.2);
    g.addColorStop(0, "rgba(255,206,138," + (0.34 * a).toFixed(3) + ")");
    g.addColorStop(0.35, "rgba(255,182,104," + (0.12 * a).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(q.x, q.y, r * 5.2, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = "rgba(255,236,190," + (0.42 * a).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(q.x, q.y, r * 0.8, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

/* ========== 晨昏线光晕 ========== */
function drawTerminator(sun) {
  // 相机空间中与太阳方向垂直的两个基向量
  let u = { x: -sun.z, y: 0, z: sun.x };
  const ul = Math.hypot(u.x, u.y, u.z) || 1;
  u = { x: u.x / ul, y: u.y / ul, z: u.z / ul };
  const v = {
    x: sun.y * u.z - sun.z * u.y,
    y: sun.z * u.x - sun.x * u.z,
    z: sun.x * u.y - sun.y * u.x
  };

  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R, 0, 6.2832);
  ctx.clip();
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = Math.max(2, G.R * 0.010);
  ctx.strokeStyle = "rgba(150,205,255,.26)";
  ctx.beginPath();
  let started = false;
  for (let a = 0; a <= 360; a += 3) {
    const r = a * RAD;
    const px = u.x * Math.cos(r) + v.x * Math.sin(r);
    const py = u.y * Math.cos(r) + v.y * Math.sin(r);
    const pz = u.z * Math.cos(r) + v.z * Math.sin(r);
    if (pz > 0.02) {
      const sx = G.cx + px * G.R, sy = G.cy - py * G.R;
      if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
    } else started = false;
  }
  ctx.stroke();
  ctx.restore();
}

/* ========== 太阳高光 + 边缘光 ========== */
function drawSunHighlight(sun) {
  const q = project(sun.lat, sun.lon);
  if (q.z <= 0.02) return;
  const k = smooth(0.02, 0.55, q.z);
  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R, 0, 6.2832);
  ctx.clip();
  ctx.globalCompositeOperation = "lighter";
  const rr = G.R * 0.85;
  const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, rr);
  g.addColorStop(0, "rgba(255,246,214," + (0.30 * k).toFixed(3) + ")");
  g.addColorStop(0.4, "rgba(255,224,160," + (0.09 * k).toFixed(3) + ")");
  g.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(q.x, q.y, rr, 0, 6.2832);
  ctx.fill();
  ctx.restore();
}

function drawAtmosphere() {
  const g = ctx.createRadialGradient(G.cx, G.cy, G.R * 0.90, G.cx, G.cy, G.R * 1.45);
  g.addColorStop(0, "rgba(90,175,255,.28)");
  g.addColorStop(0.30, "rgba(60,130,235,.13)");
  g.addColorStop(1, "rgba(20,60,150,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R * 1.45, 0, 6.2832);
  ctx.fill();
}

function drawRim() {
  ctx.save();
  ctx.beginPath();
  ctx.arc(G.cx, G.cy, G.R - 0.5, 0, 6.2832);
  ctx.strokeStyle = "rgba(160,215,255,.26)";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();
}

/* ========== 北京标记 ========== */
function drawBeijing(ts) {
  const q = project(39.9, 116.4);
  if (q.z <= 0.03) return;
  const k = smooth(0.03, 0.3, q.z);
  const pulse = 0.5 + 0.5 * Math.sin(ts * 0.0022);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.globalCompositeOperation = "lighter";
  const r = Math.max(3, G.R * 0.016);
  const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * (2.6 + pulse * 1.6));
  g.addColorStop(0, "rgba(255,255,255,.95)");
  g.addColorStop(0.3, "rgba(255,214,150,.55)");
  g.addColorStop(1, "rgba(255,180,90,0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(q.x, q.y, r * (2.6 + pulse * 1.6), 0, 6.2832);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.strokeStyle = "rgba(255,236,200,.55)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(q.x, q.y, r * (2.2 + pulse * 2.4), 0, 6.2832);
  ctx.stroke();
  ctx.fillStyle = "rgba(255,250,240,.92)";
  ctx.font = "600 " + Math.max(10, G.R * 0.032) + "px system-ui,sans-serif";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("北京", q.x + r * 2.4, q.y - r * 0.4);
  ctx.restore();
}

/* ========== 主循环 ========== */
function drawStars(ts) {
  const t = ts * 0.001;
  ctx.save();
  for (let i = 0; i < G.stars.length; i++) {
    const s = G.stars[i];
    const tw = 0.6 + 0.4 * Math.sin(t * s.sp + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = "#dfe9ff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

let lastFrame = 0;
function frame(ts) {
  const dt = lastFrame ? Math.min(ts - lastFrame, 100) : 16;
  lastFrame = ts;

  if (!G.dragging) {
    if (Math.abs(G.dragVel) > 0.00002) {
      G.rot += G.dragVel * dt;
      G.dragVel *= Math.pow(0.94, dt / 16);
    } else {
      G.dragVel = 0;
      G.rot += (0.00028 * G.spin) * dt / 16;
    }
  }

  const sun = sunVector(Date.now());

  ctx.clearRect(0, 0, G.w, G.h);
  drawStars(ts);
  drawAtmosphere();
  drawSphere(sun, ts);
  drawGraticule();
  if (G.showCity) drawCities(ts, sun);
  drawTerminator(sun);
  drawSunHighlight(sun);
  drawRim();
  drawBeijing(ts);

  requestAnimationFrame(frame);
}

let stats = { days: {}, streak: 0 };
let cycleCount = 0;

const el = {
  clock: $("clock"), clockSub: $("clockSub"),
  digits: $("digits"), phase: $("phaseLabel"), status: $("status"),
  progress: $("progress"), knob: $("knob"),
  start: $("startBtn"), reset: $("resetBtn"), skip: $("skipBtn"),
  tabs: $("tabs"), card: $("card"),
  done: $("statDone"), min: $("statMin"), streak: $("statStreak"),
  harvest: $("harvest"), toast: $("toast"),
  panel: $("panel"), scrim: $("scrim"),
  mouth: $("mouth")
};

const RING_R = 88;
const RING_C = 2 * Math.PI * RING_R;
el.progress.style.strokeDasharray = RING_C.toFixed(2) + " " + RING_C.toFixed(2);
el.progress.style.strokeDashoffset = RING_C.toFixed(2);

/* ---------- 存储 ---------- */
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data && data.cfg) cfg = Object.assign({}, DEFAULTS, data.cfg);
    if (data && data.stats) stats = Object.assign({ days: {}, streak: 0 }, data.stats);
  } catch (e) { /* 数据损坏时忽略 */ }
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ cfg: cfg, stats: stats, savedAt: Date.now() }));
    } catch (e) { /* 空间不足时忽略 */ }
  }, 150);
}

function todayRecord() {
  const k = dateKey();
  if (!stats.days[k]) stats.days[k] = { done: 0, minutes: 0 };
  return stats.days[k];
}

function computeStreak() {
  let n = 0;
  const now = Date.now();
  for (let i = 0; i < 400; i++) {
    const rec = stats.days[dateKey(now - i * 86400000)];
    if (rec && rec.done > 0) n++;
    else if (i > 0) break;
  }
  return n;
}

/* ---------- 提示音 ---------- */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function beep(freq, start, dur, gain) {
  const ac = ensureAudio();
  if (!ac) return;
  const t0 = ac.currentTime + start;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  osc.connect(g).connect(ac.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function playChime(kind) {
  if (!cfg.sound) return;
  const v = clamp(cfg.volume, 0, 1) * 0.5;
  if (v <= 0.001) return;
  if (kind === "focus") {
    beep(523.25, 0, 0.5, v);
    beep(659.25, 0.14, 0.5, v);
    beep(783.99, 0.28, 0.6, v);
    beep(1046.5, 0.46, 0.9, v * 0.8);
  } else if (kind === "break") {
    beep(783.99, 0, 0.45, v * 0.9);
    beep(659.25, 0.16, 0.45, v * 0.9);
    beep(523.25, 0.32, 0.7, v * 0.8);
  } else {
    beep(880, 0, 0.18, v * 0.7);
  }
}

/* ---------- 撒花 ---------- */
const CONFETTI_COLORS = ["#ff7a5c", "#ffd166", "#8bf3c8", "#6fb6ff", "#ff9ecd", "#fff1b8"];
function confetti(n) {
  if (!cfg.confetti) return;
  const count = n || 46;
  for (let i = 0; i < count; i++) {
    const d = document.createElement("i");
    d.className = "confetti";
    const size = 6 + Math.random() * 7;
    d.style.left = (8 + Math.random() * 84) + "vw";
    d.style.width = size + "px";
    d.style.height = (size * (1 + Math.random())).toFixed(1) + "px";
    d.style.background = CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0];
    d.style.setProperty("--dx", ((Math.random() - 0.5) * 220).toFixed(0) + "px");
    d.style.setProperty("--rot", (Math.random() * 900 - 450).toFixed(0) + "deg");
    const dur = 1.9 + Math.random() * 1.6;
    d.style.animationDuration = dur.toFixed(2) + "s";
    d.style.animationDelay = (Math.random() * 0.35).toFixed(2) + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), (dur + 0.6) * 1000);
  }
}

/* ---------- Toast ---------- */
let toastTimer = 0;
function toast(msg, ms) {
  el.toast.textContent = msg;
  el.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove("show"), ms || 2600);
}


/* ---------- 渲染 ---------- */
function modeMinutes(mode) {
  if (mode === "short") return cfg.short;
  if (mode === "long") return cfg.long;
  return cfg.focus;
}

function setMouth(happy) {
  el.mouth.setAttribute("d", happy
    ? "M25 39c2.4 3.8 5 5.6 7 5.6s4.6-1.8 7-5.6"
    : "M27 40c1.6 2.2 3.4 3.2 5 3.2s3.4-1 5-3.2");
}

function paintProgress(remain) {
  const ratio = P.total > 0 ? clamp(1 - remain / P.total, 0, 1) : 0;
  el.progress.style.strokeDashoffset = (RING_C * (1 - ratio)).toFixed(2);
  const ang = -Math.PI / 2 + ratio * Math.PI * 2;
  el.knob.setAttribute("cx", (100 + Math.cos(ang) * RING_R).toFixed(2));
  el.knob.setAttribute("cy", (100 + Math.sin(ang) * RING_R).toFixed(2));
  el.knob.setAttribute("opacity", ratio > 0.003 ? "0.95" : "0");
}

function renderStats() {
  const rec = todayRecord();
  el.done.textContent = rec.done;
  el.min.textContent = Math.round(rec.minutes);
  stats.streak = computeStreak();
  el.streak.textContent = stats.streak;

  el.harvest.innerHTML = "";
  const shown = Math.min(Math.max(cfg.goal, rec.done), 24);
  for (let i = 0; i < shown; i++) {
    const s = document.createElement("i");
    s.className = "tom" + (i < rec.done ? "" : " goal");
    el.harvest.appendChild(s);
  }
  const label = document.createElement("span");
  label.style.marginLeft = "4px";
  label.textContent = rec.done >= cfg.goal
    ? "目标达成，太棒了！"
    : "还差 " + (cfg.goal - rec.done) + " 个达成目标";
  el.harvest.appendChild(label);
}

function render() {
  const remain = P.running ? Math.max(0, P.endAt - Date.now()) : P.remain;
  el.digits.textContent = fmtClock(remain);
  el.digits.classList.toggle("warn", P.running && remain <= 10000 && remain > 0);
  paintProgress(remain);

  el.phase.textContent = MODES[P.mode].en;
  el.start.textContent = P.running ? "暂停" : (P.remain < P.total ? "继续" : "开始");
  el.reset.disabled = !P.running && P.remain === P.total;

  document.body.classList.toggle("running", P.running);
  document.body.classList.toggle("mode-break", P.mode !== "focus");
  for (const t of el.tabs.querySelectorAll(".tab")) {
    t.classList.toggle("active", t.dataset.mode === P.mode);
  }
  renderStats();
}

function setStatus(text) { el.status.textContent = text; }

/* ---------- 计时控制 ---------- */
function setMode(mode, silent) {
  P.mode = mode;
  P.running = false;
  P.total = modeMinutes(mode) * 60000;
  P.remain = P.total;
  P.endAt = 0;
  cancelAnimationFrame(P.raf);
  setMouth(false);
  if (!silent) {
    setStatus(mode === "focus" ? "准备好就按下开始吧" : "休息一下，看看远处吧");
  }
  render();
}

function start() {
  if (P.running) return;
  ensureAudio();
  if (P.remain <= 0) P.remain = P.total;
  P.endAt = Date.now() + P.remain;
  P.running = true;
  setMouth(true);
  setStatus(P.mode === "focus" ? "专注中，加油！" : "休息中，放松眼睛");
  render();
  tickLoop();
}

function pause() {
  if (!P.running) return;
  P.remain = Math.max(0, P.endAt - Date.now());
  P.running = false;
  cancelAnimationFrame(P.raf);
  setMouth(false);
  setStatus("已暂停，随时可以继续");
  render();
}

function toggle() { if (P.running) pause(); else start(); }

function resetTimer() {
  cancelAnimationFrame(P.raf);
  P.running = false;
  P.total = modeMinutes(P.mode) * 60000;
  P.remain = P.total;
  P.endAt = 0;
  setMouth(false);
  setStatus("已重置，重新开始吧");
  render();
}

function skip() {
  const wasFocus = P.mode === "focus";
  cancelAnimationFrame(P.raf);
  P.running = false;
  if (wasFocus) nextAfterFocus(false);
  else {
    setMode("focus", true);
    setStatus("休息结束，继续专注吧");
  }
}

function nextAfterFocus(completed) {
  if (completed) {
    const rec = todayRecord();
    rec.done += 1;
    rec.minutes += cfg.focus;
    cycleCount += 1;
    save();
  }
  const isLong = completed && cycleCount > 0 && cycleCount % cfg.round === 0;
  setMode(isLong ? "long" : "short", true);
  setStatus(completed
    ? (isLong ? "完成一轮！来个长休息吧" : "番茄完成，休息一下")
    : "已跳到休息时间");
  render();
  if (completed && cfg.auto) start();
}

function complete() {
  cancelAnimationFrame(P.raf);
  P.running = false;
  P.remain = 0;
  paintProgress(0);

  if (P.mode === "focus") {
    playChime("focus");
    confetti(52);
    toast("🎉 一个番茄完成啦！");
    nextAfterFocus(true);
  } else {
    playChime("break");
    toast("休息结束，回到专注吧");
    setMode("focus", true);
    setStatus("休息结束，继续专注吧");
    if (cfg.auto) start();
  }
}

function tickLoop() {
  cancelAnimationFrame(P.raf);
  const step = () => {
    if (!P.running) return;
    const remain = P.endAt - Date.now();
    if (remain <= 0) {
      P.remain = 0;
      complete();
      return;
    }
    el.digits.textContent = fmtClock(remain);
    el.digits.classList.toggle("warn", remain <= 10000);
    paintProgress(remain);
    P.raf = requestAnimationFrame(step);
  };
  P.raf = requestAnimationFrame(step);
}

/* ---------- 顶栏时钟 ---------- */
function updateClock() {
  const b = beijingNow();
  el.clock.textContent = pad2(b.getHours()) + ":" + pad2(b.getMinutes()) + ":" + pad2(b.getSeconds());
  el.clockSub.textContent = "北京时间 · " + (b.getMonth() + 1) + "月" + b.getDate() + "日 · 今日 "
    + todayRecord().done + " 个番茄";
}


/* ---------- 设置面板 ---------- */
function setSwitch(node, on) {
  node.classList.toggle("on", !!on);
  node.setAttribute("aria-checked", on ? "true" : "false");
}

function syncPanel() {
  $("inFocus").value = cfg.focus;
  $("inShort").value = cfg.short;
  $("inLong").value = cfg.long;
  $("inRound").value = cfg.round;
  $("inGoal").value = cfg.goal;
  $("inSpin").value = cfg.spin;
  $("inVolume").value = Math.round(cfg.volume * 100);
  setSwitch($("swAuto"), cfg.auto);
  setSwitch($("swSound"), cfg.sound);
  setSwitch($("swConfetti"), cfg.confetti);
  setSwitch($("swCity"), cfg.city);
}

function openPanel() {
  el.panel.classList.add("open");
  el.scrim.classList.add("open");
  syncPanel();
}
function closePanel() {
  el.panel.classList.remove("open");
  el.scrim.classList.remove("open");
}

function bindDuration(id, key, min, max) {
  const node = $(id);
  node.addEventListener("change", () => {
    const v = clamp(parseInt(node.value, 10) || min, min, max);
    node.value = v;
    cfg[key] = v;
    if (!P.running && (key === "focus" || key === "short" || key === "long")) {
      P.total = modeMinutes(P.mode) * 60000;
      P.remain = P.total;
    }
    if (key === "spin") G.spin = v;
    save();
    render();
  });
}
bindDuration("inFocus", "focus", 1, 180);
bindDuration("inShort", "short", 1, 60);
bindDuration("inLong", "long", 1, 90);
bindDuration("inRound", "round", 2, 12);
bindDuration("inGoal", "goal", 1, 24);
bindDuration("inSpin", "spin", 0, 10);

document.querySelectorAll(".stepper").forEach((box) => {
  const input = box.querySelector("input");
  box.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      const min = parseInt(input.min, 10), max = parseInt(input.max, 10);
      const cur = parseInt(input.value, 10) || min;
      input.value = clamp(cur + (btn.dataset.act === "inc" ? 1 : -1), min, max);
      input.dispatchEvent(new Event("change", { bubbles: true }));
    });
  });
});

$("inVolume").addEventListener("input", () => {
  cfg.volume = clamp(parseInt($("inVolume").value, 10) / 100, 0, 1);
  save();
});

$("swAuto").addEventListener("click", () => {
  cfg.auto = !cfg.auto;
  setSwitch($("swAuto"), cfg.auto);
  save();
});
$("swSound").addEventListener("click", () => {
  cfg.sound = !cfg.sound;
  setSwitch($("swSound"), cfg.sound);
  save();
  if (cfg.sound) playChime("tick");
});
$("swConfetti").addEventListener("click", () => {
  cfg.confetti = !cfg.confetti;
  setSwitch($("swConfetti"), cfg.confetti);
  save();
});
$("swCity").addEventListener("click", () => {
  cfg.city = !cfg.city;
  setSwitch($("swCity"), cfg.city);
  G.showCity = cfg.city;
  save();
});

$("settingsBtn").addEventListener("click", openPanel);
$("closeBtn").addEventListener("click", closePanel);
el.scrim.addEventListener("click", closePanel);

$("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({ cfg: cfg, stats: stats }, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pomodoro-" + dateKey() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("记录已导出");
});

$("clearBtn").addEventListener("click", () => {
  if (!confirm("确定清空今天的番茄记录吗？")) return;
  delete stats.days[dateKey()];
  cycleCount = 0;
  save();
  render();
  updateClock();
  toast("今日记录已清空");
});

/* ---------- 交互 ---------- */
el.start.addEventListener("click", toggle);
el.reset.addEventListener("click", resetTimer);
el.skip.addEventListener("click", skip);
el.tabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".tab");
  if (!btn || btn.dataset.mode === P.mode) return;
  cancelAnimationFrame(P.raf);
  P.running = false;
  setMode(btn.dataset.mode, false);
});

function toggleFullscreen() {
  const d = document;
  const isFs = d.fullscreenElement || d.webkitFullscreenElement;
  if (!isFs) {
    const r = d.documentElement;
    const fn = r.requestFullscreen || r.webkitRequestFullscreen;
    if (fn) fn.call(r);
  } else {
    const fn = d.exitFullscreen || d.webkitExitFullscreen;
    if (fn) fn.call(d);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.target.matches && e.target.matches("input, textarea, select")) return;
  if (e.code === "Space") {
    e.preventDefault();
    toggle();
  } else if (e.key === "r" || e.key === "R") {
    resetTimer();
  } else if (e.key === "s" || e.key === "S") {
    el.panel.classList.contains("open") ? closePanel() : openPanel();
  } else if (e.key === "f" || e.key === "F") {
    toggleFullscreen();
  } else if (e.key === "Escape") {
    closePanel();
  }
});

document.addEventListener("dblclick", (e) => {
  if (e.target.closest("button, input, a, aside, nav")) return;
  toggleFullscreen();
});

canvas.addEventListener("pointerdown", (e) => {
  G.dragging = true;
  G.lastX = e.clientX;
  G.dragVel = 0;
  canvas.classList.add("dragging");
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!G.dragging) return;
  const dx = e.clientX - G.lastX;
  G.lastX = e.clientX;
  G.rot += dx * 0.006;
  G.dragVel = dx * 0.00055;
});
function endDrag() {
  G.dragging = false;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (P.running) {
    if (Date.now() >= P.endAt) {
      P.remain = 0;
      complete();
    } else {
      tickLoop();
    }
  }
  updateClock();
  render();
});

window.addEventListener("resize", resize);

/* ---------- 启动 ---------- */
load();
buildLandMask();
G.spin = cfg.spin;
G.showCity = cfg.city;
resize();
syncPanel();
setMode("focus", true);
setStatus("准备好了就按下开始吧");
render();
updateClock();
setInterval(updateClock, 1000);
setInterval(() => { if (!P.running) renderStats(); }, 30000);
requestAnimationFrame(frame);
</script>
</body>
